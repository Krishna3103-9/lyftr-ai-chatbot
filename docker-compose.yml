name: lyftr-ai

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      LLM_API_BASE: ${LLM_API_BASE:-}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a concise, helpful assistant.}
      LITELLM_CACHE_TYPE: ${LITELLM_CACHE_TYPE:-local}
      LITELLM_CACHE_TTL_SECONDS: ${LITELLM_CACHE_TTL_SECONDS:-3600}
      LITELLM_CACHE_DIR: /data/llm_cache
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
